<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — Northwest Safety & Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --nw2-navy: #183b5e;
        --nw2-navy-dark: #102b45;
        --nw2-navy-deep: #0c2034;
        --nw2-teal: #2bb0ac;
        --nw2-orange: #ee6d29;
        --nw2-orange-light: #ff8a4d;
        --nw2-white: #ffffff;
        --nw2-muted: #7c8794;
        --nw2-border: #e2e6eb;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          135deg,
          var(--nw2-navy-dark),
          var(--nw2-navy-deep)
        );
        padding: 20px;
        opacity: 0;
        animation: fadeInPage 0.6s ease-in-out forwards;
        transition: opacity 0.4s ease-in-out;
      }
      body.fade-out {
        opacity: 0;
      }

      @keyframes fadeInPage {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== CARD ===== */
      .forgot-card {
        width: 100%;
        max-width: 480px;
        background-color: var(--nw2-white);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ===== HEADER (dark) with brand box top ===== */
      .card-header {
        background: linear-gradient(
          135deg,
          var(--nw2-navy) 0%,
          var(--nw2-navy-dark) 100%
        );
        padding: 22px 32px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 14px;
      }

      /* ✅ Brand Box — WHITE background, TOP */
      .brand-box {
        background-color: var(--nw2-white);
        border-radius: 500px;
        padding: 30px 6%;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      }

      .brand-box img {
        height: 100px;
        width: auto;
        object-fit: cover;
      }

      .brand-box span {
        color: var(--nw2-navy);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.4px;
        white-space: nowrap;
      }

      /* Heading — BELOW brand box */
      .header-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--nw2-white);
      }

      .avatar {
        flex-shrink: 0;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.12);
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--nw2-white);
      }
      .avatar svg {
        width: 20px;
        height: 20px;
      }

      .header-text {
        text-align: left;
        color: var(--nw2-white);
      }
      .header-text h1 {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.3px;
        margin-bottom: 1px;
      }
      .header-text p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
      }

      /* ===== BODY (form) ===== */
      .card-body {
        padding: 28px 32px 30px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 18px;
      }

      label {
        color: var(--nw2-navy);
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid var(--nw2-border);
        border-radius: 7px;
        font-size: 13.5px;
        font-family: "Poppins", sans-serif;
        color: #333;
        background-color: #fbfcfd;
        transition: all 0.25s ease;
        height: 44px;
      }
      input::placeholder {
        color: #a3acb6;
      }
      input:focus {
        outline: none;
        border-color: var(--nw2-teal);
        background-color: #fff;
        box-shadow: 0 0 0 3px rgba(43, 176, 172, 0.12);
      }

      .error {
        color: #e74c3c;
        font-size: 11px;
        margin-top: 4px;
        min-height: 12px;
        display: none;
      }

      .btn-reset {
        width: 100%;
        padding: 12px;
        background-color: var(--nw2-navy);
        color: var(--nw2-white);
        border: none;
        border-radius: 8px;
        font-size: 14.5px;
        font-weight: 600;
        font-family: "Poppins", sans-serif;
        cursor: pointer;
        transition: background-color 0.25s ease;
        height: 46px;
        margin-top: 4px;
      }
      .btn-reset:hover {
        background-color: var(--nw2-navy-dark);
      }

      /* Back to login */
      .back-link {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #555;
        padding-top: 14px;
        border-top: 1.5px solid var(--nw2-border);
      }
      .back-link a {
        color: var(--nw2-navy);
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        margin-left: 4px;
      }
      .back-link a:hover {
        color: var(--nw2-orange);
        text-decoration: underline;
      }

      /* ===== MOBILE ===== */
      @media (max-width: 500px) {
        body {
          align-items: flex-start;
          padding: 16px;
        }
        .card-header {
          padding: 18px 20px 16px;
          gap: 12px;
        }
        .brand-box {
          padding: 8px 14px;
          gap: 10px;
        }
        .brand-box img {
          height: 42px;
        }
        .brand-box span {
          font-size: 14px;
        }
        .header-text h1 {
          font-size: 17px;
        }
        .header-text p {
          font-size: 11px;
        }
        .card-body {
          padding: 22px 20px 24px;
        }
      }

      @media (max-width: 380px) {
        .brand-box {
          flex-direction: column;
          gap: 6px;
          padding: 8px 14px;
        }
        .brand-box img {
          height: 38px;
        }
        .brand-box span {
          font-size: 13px;
          text-align: center;
          white-space: normal;
        }
        .header-content {
          flex-direction: column;
          gap: 8px;
        }
        .header-text {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="forgot-card">
      <!-- ===== HEADER: Brand box UPAR, Heading NEECHE ===== -->
      <div class="card-header">
        <!-- ✅ Brand Box (WHITE) — TOP -->
        <div class="brand-box">
          <a href="index.html">
            <img
              src="assets/Logo/NSH Logo 01.png"
              alt="Northwest Safety & Health Logo"
            />
          </a>
          <!-- <span>Northwest Safety &amp; Health</span> -->
        </div>

        <!-- ✅ Heading — BELOW brand box -->
        <div class="header-content">
          <div class="avatar">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <div class="header-text">
            <h1>Forgot Password?</h1>
            <p>No worries, we'll send you reset instructions.</p>
          </div>
        </div>
      </div>

      <!-- ===== BODY ===== -->
      <div class="card-body">
        <form id="forgotForm" onsubmit="return validateForgotPassword();">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your registered email"
              oninput="clearError('emailError')"
            />
            <div id="emailError" class="error"></div>
          </div>

          <button type="submit" class="btn-reset">Send Reset Link</button>

          <div class="back-link">
            <a id="backToLoginLink">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              Back to Login
            </a>
          </div>
        </form>
      </div>
    </div>

    <script>
      function clearError(id) {
        document.getElementById(id).style.display = "none";
      }
      function setError(id, msg) {
        const el = document.getElementById(id);
        el.innerText = msg;
        el.style.display = "block";
      }

      // ✅ Smooth fade navigation
      function navigateWithFade(url) {
        document.body.classList.add("fade-out");
        setTimeout(() => {
          window.location.href = url;
        }, 400);
      }

      function validateForgotPassword() {
        let isValid = true;
        const email = document.getElementById("email").value.trim();

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
          setError("emailError", "Please enter a valid email address.");
          isValid = false;
        }

        if (isValid) {
          alert("Password reset link sent to your email!");
          navigateWithFade("login.html");
        }
        return false;
      }

      // ✅ Back to Login link with fade
      document
        .getElementById("backToLoginLink")
        .addEventListener("click", function (e) {
          e.preventDefault();
          navigateWithFade("login.html");
        });
    </script>
  </body>
</html>
